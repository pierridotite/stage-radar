# Collecte quotidienne des offres, puis publication du tableau de bord sur GitHub Pages.
# L'historique (data/radar.db : dates de première apparition, tailles d'entreprise) est conservé
# d'un jour à l'autre dans le cache GitHub Actions plutôt que commité, pour ne pas alourdir le dépôt.
name: radar-quotidien

on:
  schedule:
    - cron: "30 5 * * *"   # 7h30 heure de Paris (été), 6h30 (hiver)
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Tests
        run: |
          python -m unittest discover tests
          node --test cv-worker/test/worker.test.mjs

      - name: Récupérer l'historique de la veille
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Collecter et scorer
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          TZ: Europe/Paris
          RADAR_WORKERS: "16"
        run: python -m radar

      - name: Sauvegarder l'historique
        if: always() && hashFiles('data/radar.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# =====================================================================
# Dictionnaire du "fit CV" : le même vocabulaire sert à lire les offres (Python, à la collecte)
# et le CV déposé (navigateur, sur l'ordinateur de l'élève : le CV n'est envoyé nulle part).
# Termes en minuscules SANS accents ; '*' final = préfixe.
#
# fit = compétences exigées (50) + appréciées (5) + domaine (25) + métier visé (20)
#       - compétences bloquantes manquantes - langue manquante
# =====================================================================

weights:
  skills: 50          # part des compétences EXIGÉES par l'offre que le CV contient
  nice: 5             # compétences appréciées (offres analysées par l'IA) présentes dans le CV
  skills_neutral: 0.5 # offre qui ne cite aucune compétence : couverture supposée de 50 %
  skills_smoothing: 2 # lissage : 2/2 compétences (75 %) compte moins que 7/7 (89 %), peu d'indices = moins de certitude
  domain: 25          # l'offre est dans un domaine où le CV a de l'expérience
  role: 20            # l'intitulé correspond au métier que le CV vise
  role_generic: 8     # intitulé data générique quand le CV ne précise pas de métier
  hard_missing: -5    # par compétence "bloquante" demandée et absente du CV (max -15)
  hard_missing_cap: -15
  language_missing: -15

levels:               # libellés affichés
  - {min: 75, label: "Très bon fit"}
  - {min: 60, label: "Bon fit"}
  - {min: 45, label: "Fit moyen"}
  - {min: 0, label: "Fit faible"}

# hard: true = compétence difficile à acquérir en cours de stage : son absence pénalise

# =====================================================================
# Grille de score, modifiable sans toucher au code.
# Les mots-clés s'écrivent en minuscules SANS accents ; un '*' final = préfixe
# ("statisti*" couvre statistique, statistician, statistiques...).
# =====================================================================

school:
  name: Institut Agro Rennes-Angers
  track: Diplôme d'ingénieur, spécialisation Data science (M2)
  internship: Stage de fin d'études, 6 mois, début février 2027

# ---------------------------------------------------------------------
# 1. PERTINENCE : l'offre est-elle un stage data ? (sinon elle est écartée)
# ---------------------------------------------------------------------
relevance:
  min_score: 30
  title_terms: [data, donnee*, "machine learning", ml, ia, ai, "intelligence artificielle", statisti*, biostat*,
                analyst, analysts, analyste*, analytics, analytique*, modelisation, modeling, modelling,
                "deep learning", nlp, llm*, genai, "gen ai", bi, "business intelligence", "power bi", quantitati*,
                forecast*, prevision*, datascien*, algorithm*, "computer vision", "vision par ordinateur", mlops,
                dataviz, "data viz", biometri*, chimiometri*, sensometri*, "science des donnees",
                "sciences des donnees", "data-driven", "predicti*", "optimisation", "recherche operationnelle"]
  # Intitulés qui contiennent "data" sans être des postes data (juridique, RH, contenu, vente...)
  title_exclude: [legal, juriste, juridique, counsel, avocat*, lawyer, "data protection", "protection des donnees", rgpd,
                  gdpr, dpo, compliance, conformite, "ressources humaines", rh, hr, recrutement, recruit*, talent,
                  communication, "content creation", "creation de contenu", contenu, content, "social media", journalis*,
                  sales, commercial, vente, "business develop*", achats, purchasing, comptab*, accounting, audit,
                  "account manager", "office manager", "event*", evenementiel, design, designer, graphi*, artist]
  description_terms: [python, r, rstudio, tidyverse, shiny, sql, "machine learning", statisti*, modelisation,
                      "power bi", pandas, "scikit-learn", sklearn, tensorflow, pytorch, "data science",
                      "analyse de donnees", "analyses de donnees", "data analysis", "big data", dataiku, databricks,
                      spark, knime, sas, spss, jmp, minitab, "plan d'experience*", "design of experiment*",
                      anova, regression, "series temporelles", "time series", "deep learning", "apprentissage automatique"]

# ---------------------------------------------------------------------
# 2. ACCESSIBILITÉ pour un·e élève de l'Institut Agro (0-100)
#    score = base + somme des règles déclenchées, borné entre 5 et 98
# ---------------------------------------------------------------------
accessibility:
  base: 55

  # Règles "mots-clés" : déclenchées si un terme apparaît dans le titre ou la description.
  # per_match + cap : points par terme distinct trouvé, plafonnés.
  rules:
    - label: "Cible école d'ingénieur / Bac+5"
      points: 6
      terms: ["ecole d'ingenieur*", "ecole d'ingenieurs", "bac+5", "bac +5", "bac + 5", "master 2", m2,
              "engineering school", "engineering degree", "master's degree", "msc", "grande ecole"]
    - label: "Profil agro / sciences du vivant recherché"
      points: 12
      terms: [agronom*, "ingenieur agro*", "ecole d'agro*", "sciences du vivant", "life science*", "food science*",
              "sciences des aliments", biologi*, biotech*, "sciences de l'environnement", ecolog*, "agroparistech",
              "institut agro", "agrocampus"]
    - label: "Statistique appliquée au cœur du poste"
      points: 8
      terms: [biostat*, "plan d'experience*", "plans d'experience*", "design of experiment*", doe, anova,
              "modeles mixtes", "mixed model*", chimiometri*, sensometri*, "analyse sensorielle", "essais terrain",
              "statistique appliquee", "applied statistics", "analyse multivariee", "multivariate"]
    - label: "Outils maîtrisés par la promo (Python, R, SQL...)"
      per_match: 2
      cap: 8
      terms: [python, r, rstudio, tidyverse, shiny, sql, pandas, "scikit-learn", sklearn, "power bi", excel, vba, git]
    - label: "Stage de fin d'études / 6 mois"
      points: 6
      terms: ["fin d'etudes", "end of studies", "end-of-studies", "6 mois", "six mois", "6 months", "six months",
              pfe, "final year", "derniere annee", "final-year"]
    - label: "Début janvier-avril 2027"
      points: 10
      terms: ["janvier 2027", "fevrier 2027", "mars 2027", "avril 2027", "january 2027", "february 2027",
              "march 2027", "april 2027", "debut 2027", "early 2027", "printemps 2027", "spring 2027",
              "1er semestre 2027", "janvier/fevrier 2027", "jan 2027", "feb 2027", "fev 2027", "01/2027", "02/2027", "03/2027"]
    - label: "Début en 2026 : trop tôt"
      points: -15
      terms: ["septembre 2026", "octobre 2026", "novembre 2026", "decembre 2026", "september 2026", "october 2026",
              "november 2026", "december 2026", "asap", "des que possible", "as soon as possible", "immediatement"]
    - label: "Stage court (2 à 4 mois)"
      points: -10
      terms: ["2 mois", "3 mois", "4 mois", "2 months", "3 months", "4 months", "stage de 2 mois", "summer internship",
              "stage d'ete", "stage ete"]
    - label: "Profil école de commerce attendu"
      points: -15
      terms: ["ecole de commerce", "business school", "ecole de management", "grande ecole de commerce", "iae",
              "master marketing", "master en marketing", "master in management", "mim"]
    - label: "Écoles très ciblées (X, Centrale, Mines, ENSAE...)"
      points: -8
      terms: [polytechnique, centrale*, "ecole des mines", "mines paris*", ensae, ensimag, "telecom paris", "ens ulm",
              "top-tier", "top tier", "top engineering school*", "premier rang", "hec", essec, escp]
    - label: "Doctorat ou profil recherche avancé demandé"
      points: -15
      terms: [phd, "ph.d", doctorat, doctoral, doctorant*, "these cifre"]
    - label: "Stack informatique pointue (hors cursus)"
      per_match: -4
      cap: -12
      terms: ["c++", scala, kubernetes, rust, cuda, java, golang, kotlin, react, typescript, terraform, devops,
              "embedded systems", "embedded c", "systemes embarques", "logiciel embarque", fpga, "c#"]
    - label: "Autre langue que l'anglais exigée"
      points: -8
      terms: ["allemand courant", "fluent german", "german fluent", "fluent in german", deutsch, "italien courant",
              "fluent italian", "fluent in italian", japonais, japanese, mandarin, "fluent spanish", "espagnol courant",
              "fluent dutch", neerlandais, "dutch speaking"]

  # Réseau de l'école : secteurs et entreprises où les élèves Institut Agro sont attendus.
  sector_points:
    agro: 10
    sport: 3
    industrie: 2
    data: 0
    conseil: 0
    luxe: 0

  # Entreprises qui recrutent déjà des stagiaires Institut Agro / AgroParisTech (à enrichir avec les
  # retours de la promo et du service stages).
  network_companies:
    points: 10
    names: [danone, lactalis, bonduelle, limagrain, vilmorin, invivo, avril, sodiaal, savencia, roquette, tereos,
            puratos, "groupe rocher", "yves rocher", agrial, eureden, terrena, cooperl, "groupe even", arvalis, inrae,
            "groupe bel", bel, nestle, syngenta, lesaffre, soufflet, mccain, bayer, corteva, lallemand, "pierre fabre",
            "l'oreal", loreal, cameca, "atelier du chocolat", "sodebo", "fleury michon", "d'aucy", "triballat",
            "biocodex", "euralis", "maisadour", "vivescia", "axereal", "hectar", "ynsect"]

  # Marques très convoitées : beaucoup plus de candidatures par offre.
  high_demand_companies:
    points: -8
    names: [lvmh, "louis vuitton", dior, chanel, hermes, cartier, richemont, kering, gucci, "saint laurent",
            "moet hennessy", sephora, google, meta, apple, amazon, microsoft, bcg, mckinsey, bain, nike, adidas,
            "on running", mistral, datadog, dataiku, doctolib, alan, qonto, "back market", spotify, netflix]

  freshness:            # jours depuis la publication
    new_days: 7
    new_points: 3
    stale_days: 60
    stale_points: -8

  grades:               # seuils des lettres affichées
    A: 75
    B: 60
    C: 45

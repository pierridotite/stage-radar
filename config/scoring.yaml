# =====================================================================
# Grille de notation, modifiable sans toucher au code.
# Mots-clés en minuscules SANS accents ; un '*' final = préfixe ("statisti*" couvre statistique, statistician...).
#
# La note répond à une question : "un·e élève data science de l'Institut Agro a-t-il de vraies chances
# sur ce stage, et est-ce un vrai stage data ?". Elle combine trois axes indépendants, chacun expliqué :
#   DATA        (0-100) : est-ce un poste data ?
#   PROFIL      (0-100) : notre profil correspond-il à ce qui est demandé ?
#   CONCURRENCE (faible / moyenne / forte) : combien de candidats en face ?
# plus un filtre CALENDRIER (compatible / à vérifier / hors calendrier) pour un début en février 2027.
#
#   score = (DATA + PROFIL) / 2 + ajustement concurrence + ajustement calendrier
#   A : score >= 75, avec DATA >= 70 et PROFIL >= 65      B : score >= 62, avec DATA >= 55
#   C : score >= 50                                       D : en dessous
#   (seuils recalés le 24/09/2026 sur les notes de l'analyse IA : ~27 % de A, ~45 % de B)
#   Hors calendrier : début en 2026 ou stage court, quelle que soit la note (affiché à part)
# =====================================================================

school:
  name: Institut Agro Rennes-Angers
  track: Diplôme d'ingénieur, spécialisation Data science (M2)
  internship: Stage de fin d'études, 6 mois, début février 2027

# ---------------------------------------------------------------------
# DATA : est-ce un poste data ?
# ---------------------------------------------------------------------
data:
  min_to_keep: 35            # en dessous, l'offre n'est pas un stage data : écartée du tableau de bord
  title_strong:              # intitulé clairement data : +55
    points: 55
    terms: [data, donnee*, "machine learning", ml, ia, ai, "intelligence artificielle", statisti*, biostat*,
            datascien*, "deep learning", nlp, llm*, genai, "gen ai", "computer vision", "vision par ordinateur",
            mlops, "business intelligence", bi, "power bi", dataviz, biometri*, chimiometri*, sensometri*,
            bioinformati*, "science des donnees", "sciences des donnees", modelisation, modeling, modelling,
            "recherche operationnelle", forecast*, prevision*, quantitati*, analytics, analytique*, "data-driven",
            predicti*, algorithm*, "modele statistique*", "modeles statistiques", "estimation de parametres",
            genomique, "genetique quantitative", "parametres genetiques", econometri*, actuari*]
  title_weak:                # intitulé "analyse" plus vague : +30
    points: 30
    terms: [analyst, analysts, analyste*, insight*, performance, "controle de gestion", pricing, "supply chain planner",
            "demand planner", digital, numerique, automatisation, automation, crm, modele*, analyse, estimation,
            simulation, "aide a la decision", optimisation]
  skills:                    # compétences data citées dans l'annonce : +8 par compétence distincte, max +45
    per_match: 8
    cap: 45
    terms: [python, r, rstudio, tidyverse, shiny, sql, "machine learning", statisti*, modelisation, "power bi", tableau,
            pandas, "scikit-learn", sklearn, tensorflow, pytorch, "data science", "analyse de donnees",
            "analyses de donnees", "data analysis", "big data", dataiku, databricks, spark, knime, sas, spss, jmp,
            minitab, "plan d'experience*", "design of experiment*", anova, regression, "series temporelles",
            "time series", "deep learning", "apprentissage automatique", "modeles mixtes", "mixed model*", glm,
            dataviz, "visualisation de donnees", "data visualization", qgis, sig, "bases de donnees", etl]
  not_data:                  # paillasse / terrain / vente : -25 si dans l'intitulé ou 2 termes distincts dans l'annonce
    points: -25
    terms: [paillasse, pcr, qpcr, "culture cellulaire", "cultures cellulaires", microscopie, "biologie moleculaire",
            sequencage, prelevement*, echantillonnage, "suivi d'essais", "essais au champ", "experimentation au champ",
            "sondes fluorescentes", "conseiller de vente", "conseillere de vente", "vente en magasin", "manipulations"]
  # Intitulés qui contiennent "data" sans être des postes data (juridique, RH, contenu, vente...) : écartés
  title_exclude: [legal, juriste, juridique, counsel, avocat*, lawyer, "data protection", "protection des donnees", rgpd,
                  gdpr, dpo, compliance, conformite, "ressources humaines", rh, hr, recrutement, recruit*, talent,
                  communication, "content creation", "creation de contenu", contenu, content, "social media",
                  journalis*, sales, commercial, vente, "business develop*", achats, purchasing, comptab*, accounting,
                  audit, "account manager", "office manager", "event*", evenementiel, design, designer, graphi*, artist]

# ---------------------------------------------------------------------
# PROFIL : un·e élève Institut Agro data science correspond-il à ce qui est demandé ?
# ---------------------------------------------------------------------
profile:
  base: 50
  rules:
    - label: "Formation ingénieur / M2 / statistique visée"
      points: 10
      terms: ["ecole d'ingenieur*", "ecole d'ingenieurs", "ingenieur agro*", "bac+5", "bac +5", "bac + 5", "master 2",
              m2, "engineering school", "engineering degree", "master's degree", msc, "master en statistique*",
              "master of science", "grande ecole"]
    - label: "Domaine agro, bio ou environnement : notre spécialité"
      points: 15
      terms: [agronom*, "ingenieur agro*", "ecole d'agro*", "sciences du vivant", "life science*", "food science*",
              "sciences des aliments", agroalimentaire, agriculture, agricole*, elevage, "sante animale", "genetique animale",
              "genetique vegetale", semence*, vegetal*, "productions vegetales", biologi*, ecolog*, biodiversite,
              "sciences de l'environnement", "environmental science*", environnemental*, "qualite de l'eau", hydrolog*,
              "changement climatique", "institut agro", agroparistech, agrocampus, nutrition, "analyse sensorielle",
              "qualite des aliments", genetique, genomique, phenotyp*, microbiote]
    - label: "Statistique appliquée au cœur du poste (notre point fort)"
      points: 10
      terms: [biostat*, "plan d'experience*", "plans d'experience*", "design of experiment*", doe, anova, "modeles mixtes",
              "mixed model*", glm, chimiometri*, sensometri*, "statistique appliquee", "applied statistics",
              "analyse multivariee", multivariate, "modelisation statistique", "statistical model*", inference]
    - label: "Doctorat ou profil recherche avancé demandé"
      points: -25
      terms: [phd, "ph.d", doctorat, doctoral, doctorant*, "these cifre"]
    - label: "Autre langue que l'anglais exigée"
      points: -15
      terms: ["allemand courant", "fluent german", "german fluent", "fluent in german", deutsch, "italien courant",
              "fluent italian", "fluent in italian", japonais, japanese, mandarin, "fluent spanish", "espagnol courant",
              "spanish speaker", "fluent dutch", neerlandais, "dutch speaking", "portugais courant"]
  skills_known:              # compétences de la promo citées : +4 chacune, max +16
    per_match: 4
    cap: 16
    terms: [python, r, rstudio, tidyverse, shiny, sql, pandas, "scikit-learn", sklearn, "machine learning", statisti*,
            "power bi", excel, vba, git, qgis, anova, regression]
  skills_missing:            # compétences hors cursus exigées : -6 chacune, max -18
    per_match: -6
    cap: -18
    terms: ["c++", scala, kubernetes, rust, cuda, java, golang, kotlin, react, typescript, javascript, terraform, devops,
            "embedded systems", "embedded c", "systemes embarques", "logiciel embarque", fpga, "c#", ".net", angular,
            "full stack", fullstack, backend, frontend, "ci/cd", aws, azure, gcp]
  # "École de commerce" : pénalisé seulement si c'est le SEUL profil cité (pas "commerce ou ingénieur")
  business_school:
    terms: ["ecole de commerce", "business school", "ecole de management", "master in management", mim, iae,
            "master marketing", "master en marketing"]
    alternatives: [ingenieur*, engineering, universit*, scientifique*, equivalent, "master en statistique*", sciences]
    window: 90               # caractères autour de la mention où chercher une alternative
    only_points: -25
    label_only: "Profil école de commerce attendu"

# ---------------------------------------------------------------------
# CONCURRENCE : combien de candidats en face ?
# ---------------------------------------------------------------------

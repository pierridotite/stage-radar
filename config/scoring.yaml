  points: {faible: 6, moyenne: 0, forte: -10}
  # Entreprises qui recrutent déjà des stagiaires Institut Agro / AgroParisTech : concurrence faible pour nous
  network_companies: [danone, lactalis, bonduelle, limagrain, vilmorin, invivo, avril, sodiaal, savencia, roquette, tereos,
                      puratos, "groupe rocher", "yves rocher", agrial, eureden, terrena, cooperl, "groupe even", even,
                      arvalis, inrae, "groupe bel", bel, nestle, syngenta, lesaffre, soufflet, mccain, bayer, corteva,
                      lallemand, "pierre fabre", "l'oreal", loreal, cameca, "atelier du chocolat", sodebo,
                      "fleury michon", "d'aucy", triballat, biocodex, euralis, maisadour, vivescia, axereal, hectar,
                      ragt, laita, ldc, "le duff", andros, cavac, "systeme u", ingredia, idele, ifip, "terres inovia",
                      itavi, ctifl, anses, cirad, ifremer]
  # Marques très convoitées : beaucoup plus de candidatures par offre
  high_demand_companies: [lvmh, "louis vuitton", dior, chanel, hermes, cartier, richemont, kering, gucci, "saint laurent",
                          "moet hennessy", sephora, google, meta, apple, amazon, microsoft, bcg, mckinsey, bain, nike,
                          adidas, "on running", mistral, datadog, dataiku, doctolib, alan, qonto, "back market", spotify,
                          netflix, "paris saint-germain", psg, criteo, "hugging face"]
  elite_targeting:           # l'annonce cible explicitement les écoles les plus sélectives
    terms: [polytechnique, centrale*, "ecole des mines", "mines paris*", ensae, ensimag, "telecom paris", "ens ulm",
            "top-tier", "top tier", "top engineering school*", "premier rang", hec, essec, escp]
  small_sizes: [pme, startup, public]   # structures moins exposées : concurrence faible par défaut

# ---------------------------------------------------------------------
# CALENDRIER : peut-on commencer en février 2027 pour 6 mois ?
# ---------------------------------------------------------------------
calendar:
  points: {compatible: 5, a_verifier: 0}
  # Une date ne compte que si elle suit une formule de début ("début", "à partir de", "start"...) ou figure
  # dans l'intitulé : "renforcée depuis septembre 2026" (actualité de l'entreprise) ne doit pas compter.
  # (les dates explicites en 2027, ex. "février 2027", comptent partout : peu ambigu dans une offre de stage)
  start_context: [debut, demarrage, demarrer, commencer, "a partir de", "a partir du", "des le", start, starting,
                  "start date", from, "prise de poste", disponible, disponibilite, "date d'entree", "entree en poste",
                  "a pourvoir", "au plus tot", ideally, "pour une duree", "stage de", "stage en", "stage a", "internship of",
                  "internship in", "internship starting", "periode de stage", "duree du stage"]
  context_window: 45
  compatible: ["janvier 2027", "fevrier 2027", "mars 2027", "avril 2027", "january 2027", "february 2027", "march 2027",
               "april 2027", "debut 2027", "early 2027", "printemps 2027", "spring 2027", "1er semestre 2027",
               "janvier/fevrier 2027", "jan 2027", "feb 2027", "fev 2027", "01/2027", "02/2027", "03/2027",
               "janvier", "fevrier", "january", "february"]
  too_early: ["septembre 2026", "octobre 2026", "novembre 2026", "decembre 2026", "september 2026", "october 2026",
              "november 2026", "december 2026", "sept 2026", "oct 2026", "nov 2026"]
  duration_context: [stage, internship, stagiaire, duree, pendant, "for a", "for", mission, contrat, "periode de"]
  short: ["stage de 2 mois", "stage de 3 mois", "stage de 4 mois", "2 mois", "3 mois", "4 mois", "2 months", "3 months",
          "4 months", "summer internship", "stage d'ete", "stage ete", "stage d'observation"]
  long_ok: ["6 mois", "six mois", "6 months", "six months", "fin d'etudes", "end of studies", "end-of-studies", pfe,
            "5 a 6 mois", "4 a 6 mois", "5-6 mois", "4-6 mois"]
  stale_days: 90             # annonce plus vieille : probablement pourvue (-6, signalée)
  stale_points: -6

grades:
  A: {score: 75, min_data: 70, min_profile: 65}
  B: {score: 62, min_data: 55}
  C: 50

# =====================================================================
# Analyse des offres (et des CV) par un petit modèle de langage.
#
# La clé n'est JAMAIS écrite dans le dépôt : elle est lue dans la variable d'environnement OPENAI_API_KEY
# (secret GitHub Actions pour la collecte quotidienne, secret Cloudflare pour l'analyse des CV).
# Sans clé, tout fonctionne avec les règles de config/scoring.yaml et config/fit.yaml.
# =====================================================================

enabled: true
model: gpt-5-nano            # le moins cher : 0,05 $ / M jetons en entrée, 0,40 $ / M en sortie
fallback_model: gpt-4.1-nano # utilisé si le premier n'est pas disponible sur le compte
reasoning_effort: low        # un peu de réflexion : notes mieux calibrées (quelques centimes de plus par run)
max_output_tokens: 3000     # inclut les jetons de réflexion

prompt_version: 2            # à incrémenter quand on modifie le prompt : les offres seront réanalysées

offers:
  prefilter_min_data: 15     # seules les offres au score data (règles) >= 15 partent au modèle (~800 sur ~4000)
  max_per_run: 1500          # plafond d'offres analysées par exécution (garde-fou budgétaire)
  max_chars: 7000            # description tronquée au-delà
  concurrency: 4              # requêtes simultanées (limite de débit des comptes OpenAI récents)

cv:
  max_chars: 15000

# Adresse du petit serveur Cloudflare (cv-worker/) : analyse des CV (/cv) et recherche de contacts (/contacts).
# Vide = CV analysé localement par les règles, et seulement les recherches LinkedIn manuelles pour les contacts.
worker_url: "https://radar-stages.radar-stages-institut-agro.workers.dev"

# Prix en $ par million de jetons, pour le journal de coût de chaque exécution
prices:
  gpt-5-nano: {input: 0.05, cached: 0.005, output: 0.40}
  gpt-4.1-nano: {input: 0.10, cached: 0.025, output: 0.40}

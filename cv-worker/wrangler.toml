name = "radar-stages"
main = "src/index.js"
workers_dev = true      # adresse publique : https://radar-stages.radar-stages-institut-agro.workers.dev
preview_urls = false    # pas d'adresses de prévisualisation supplémentaires
compatibility_date = "2026-09-01"

# Les clés ne sont PAS ici : elles se déclarent en secrets avec
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put TAVILY_API_KEY     (recherche de contacts ; gratuit : 1 000 recherches / mois)

[vars]
# Sites autorisés à appeler l'analyse (séparés par des virgules). Ajouter l'adresse de test locale si besoin.
ALLOWED_ORIGINS = "https://pierridotite.github.io"
MODEL = "gpt-5-nano"
FALLBACK_MODEL = "gpt-4.1-nano"

# 5 demandes par minute, par visiteur et par service : protège le budget contre les abus
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

[observability]
# Journaux d'erreurs uniquement : le code n'écrit jamais le contenu des CV
enabled = true
